[package]
name = "klarity-exhibit-16-da-vinci-pas"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Da Vinci PAS preauth checks"
publish = false

[lib]
name = "da_vinci_pas"
path = "src/lib.rs"

[[bin]]
name = "validate-pas"
path = "src/bin/validate_pas.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
